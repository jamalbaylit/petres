pages:
  - slug: grid-generation
    title: Grid Generation
    location: examples
    summary: Examples for generating and visualizing corner-point grids.

    sections:
      - title: Basic Grid Generation
        description: |
          Examples for creating rectilinear and regular corner-point grids.

        examples:
          - path: examples/grid/from_rectilinear.py
            title: Generate a Rectilinear Corner-Point Grid
            description: |
              Create a corner-point grid from non-uniform 
              coordinates.

          - path: examples/grid/from_regular.py
            title: Generate a Regular Grid
            description: |
              Create a regular grid using cell counts or cell dimensions.

      - title: Advanced Grid Generation
        description: |
          Examples for building grids from horizons, zones, and well data.

        examples:
          - path: examples/grid/from_zones.py
            title: Create a Grid from Horizons and Zones
            description: |
              Generate horizons and zones, build a pillar grid, derive a
              corner-point grid,.

          - path: examples/grid/from_wells.py
            title: Build a Grid from Well Tops and Horizons
            description: |
              Interpolate horizons from well tops, assemble zones, generate a
              corner-point grid.

  - slug: import-export
    title: Import & Export
    location: examples
    summary: Examples for importing and exporting grid geometry and property data.

    examples:
      - path: examples/grid/import_grdecl.py
        title: Import an Eclipse ".GRDECL" File
        description: |
          Import a Eclipse grid file with properties,
          and visualize the grid and property maps.

  - slug: property-modeling
    title: Property Modeling
    location: examples
    summary: Examples for assigning and manipulating properties on grids.

    examples:
      - path: examples/property/edit.py
        title: Edit Grid Property
        description: |
          Import a grid with properties, visualize property distributions, and apply
          simple transformations.
