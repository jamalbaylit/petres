<section class="slide-page main-page outro-page {{ theme }}">
    <div class="header">
        {% if logo_src %}
            <img class="logo" src="{{ logo_src }}" alt="logo">
        {% endif %}
    </div>
    
    <div class="content">
        <h1 class="title">{{ title }}</h1>
        {% if description %}
        <h4 class="description">{{ description }}</h4>
        {% endif %}
    </div>
    <div class="footer">
        <div class="footer-block">
            {% if footer_left_title %}<span class="footer-title">{{ footer_left_title }}</span>{% endif %}
            <span class="left">{{ footer_left or "" }}</span>
        </div>
        <div class="footer-block right">
            {% if footer_right_title %}<span class="footer-title">{{ footer_right_title }}</span>{% endif %}
            <span class="right">{{ footer_right or "" }}</span>
        </div>
    </div>
</section>
